<!-- students.html mejorado -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Estudiantes</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

  <h1>Gestión de Estudiantes</h1>

  <!-- Agregar estudiante - Mejorado con labels y validación -->
  <section>
    <h2>Agregar nuevo estudiante</h2>
    <form id="add-student-form">
      <div class="mb-3">
        <label for="studentName" class="form-label">Nombre completo</label>
        <input type="text" id="studentName" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="studentDNI" class="form-label">DNI</label>
        <input type="text" id="studentDNI" class="form-control" 
               pattern="\d{8}" title="Debe contener exactamente 8 dígitos" required>
        <div class="form-text">Debe contener exactamente 8 dígitos</div>
      </div>
      <div class="mb-3">
        <label for="studentCareer" class="form-label">Carrera</label>
        <select id="studentCareer" class="form-select" required></select>
      </div>
      <button type="submit" class="btn btn-success" id="submit-student-btn">
        <span class="submit-text">Crear</span>
        <span class="spinner-border spinner-border-sm d-none" role="status"></span>
      </button>
    </form>
  </section>

  <!-- Listado de estudiantes - Mejorado con búsqueda -->
  <section class="mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">Listado de estudiantes</h2>
      <div class="w-50">
        <input type="text" id="student-search" class="form-control" placeholder="Buscar estudiantes...">
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>DNI</th>
            <th>Carrera</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="studentsTableBody">
          <!-- Estudiantes se cargarán aquí -->
        </tbody>
      </table>
    </div>
    <nav aria-label="Paginación">
      <ul class="pagination justify-content-center" id="pagination">
        <!-- Paginación se generará aquí -->
      </ul>
    </nav>
  </section>

  <!-- Modal para editar estudiante - Mejorado -->
  <div class="modal fade" id="editStudentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form id="edit-student-form" class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar Estudiante</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editStudentId">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" id="editStudentName" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">DNI</label>
            <input type="text" id="editStudentDNI" class="form-control" 
                   pattern="\d{8}" title="Debe contener exactamente 8 dígitos" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Carrera</label>
            <select id="editStudentCareer" class="form-select" required></select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="save-student-btn">
            <span class="submit-text">Guardar</span>
            <span class="spinner-border spinner-border-sm d-none" role="status"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

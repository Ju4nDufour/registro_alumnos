<!-- admin.html mejorado -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador de Carreras</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

  <a href="index.html" class="btn btn-secondary mb-4">← Volver al menú principal</a>
  <h1>Gestión de Carreras</h1>

  <div class="row">
    <!-- Crear carrera - Mejorado -->
    <div class="col-md-4">
      <section>
        <h2>Agregar nueva carrera</h2>
        <form id="add-career-form">
          <div class="mb-3">
            <label for="new-career" class="form-label">Nombre de la carrera</label>
            <input type="text" id="new-career" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success" id="add-career-btn">
            <span class="submit-text">Crear</span>
            <span class="spinner-border spinner-border-sm d-none" role="status"></span>
          </button>
        </form>
      </section>
    </div>

    <!-- Editar carrera - Mejorado -->
    <div class="col-md-4">
      <section>
        <h2>Editar carrera existente</h2>
        <form id="edit-career-form">
          <div class="mb-3">
            <label for="career-to-edit" class="form-label">Carrera a editar</label>
            <select id="career-to-edit" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label for="edited-name" class="form-label">Nuevo nombre</label>
            <input type="text" id="edited-name" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary" id="edit-career-btn">
            <span class="submit-text">Editar</span>
            <span class="spinner-border spinner-border-sm d-none" role="status"></span>
          </button>
        </form>
      </section>
    </div>

    <!-- Eliminar carrera - Mejorado -->
    <div class="col-md-4">
      <section>
        <h2>Eliminar carrera</h2>
        <form id="delete-career-form">
          <div class="mb-3">
            <label for="career-to-delete" class="form-label">Carrera a eliminar</label>
            <select id="career-to-delete" class="form-select"></select>
          </div>
          <button type="submit" class="btn btn-danger" id="delete-career-btn">
            <span class="submit-text">Eliminar</span>
            <span class="spinner-border spinner-border-sm d-none" role="status"></span>
          </button>
        </form>
      </section>
    </div>
  </div>

  <!-- Mostrar listado de carreras - Mejorado -->
  <section class="mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">Listado actual de carreras</h2>
      <button class="btn btn-sm btn-outline-primary" id="refresh-careers">
        <i class="bi bi-arrow-clockwise"></i> Actualizar
      </button>
    </div>
    <div class="alert alert-warning d-none" id="careers-warning">
      No se pueden eliminar carreras que tengan estudiantes asociados
    </div>
    <ul id="career-list" class="list-group"></ul>
  </section>

  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.min.js"></script>
</body>
</html>
